# --- Admin panel API (support chat + operator REST + Socket.IO) -----------------
# MUST appear BEFORE generic `location /api` so these paths are not sent to workalong-backend.
#
# "admin-panel-api" is the Docker Compose *service name* — it resolves only on the private
# Docker network. It is NOT a public hostname. Browsers only ever use:
#   https://workalong.co.uk/support/...   (recommended REST path)
#   https://workalong.co.uk/api/support/... (legacy / alternate)
#   https://workalong.co.uk/socket.io/...
#   https://workalong.co.uk/api/admin/... (admin panel API)
# ---------------------------------------------------------------------------------

# Public: /support/... → admin server /api/support/... (clean URL, not mixed with main /api)
location ^~ /support/ {
    proxy_pass http://admin-panel-api:5055/api/support/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location ^~ /api/support/ {
    proxy_pass http://admin-panel-api:5055;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location ^~ /api/admin/ {
    proxy_pass http://admin-panel-api:5055;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Engine.IO uses HTTP long-polling first, then upgrades to WebSocket. Do NOT send
# Connection: upgrade on polling requests — use map $connection_upgrade (see main site file).
location ^~ /socket.io/ {
    proxy_pass http://admin-panel-api:5055;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
}
