# API Subdomain - HTTP Server (redirect to HTTPS or proxy to backend)
server {
    listen 80;
    server_name api.workalong.co.uk;
    
    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect to HTTPS if SSL certs exist, otherwise proxy to backend
    if (-f /etc/nginx/ssl/fullchain.pem) {
        return 301 https://$host$request_uri;
    }
    
    # Proxy all requests to backend
    # Frontend will add /api to URLs, so we preserve the full path
    location / {
        proxy_pass http://workalong-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTP Server - Redirect to HTTPS if SSL exists
server {
    listen 80;
    server_name workalong.co.uk www.workalong.co.uk localhost 127.0.0.1;
    
    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect to HTTPS if SSL certs exist, otherwise serve HTTP
    if (-f /etc/nginx/ssl/fullchain.pem) {
        return 301 https://$host$request_uri;
    }
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Maintenance mode - check for flag file
    # If /var/www/maintenance/maintenance.flag exists, serve maintenance page
    if (-f /var/www/maintenance/maintenance.flag) {
        set $maintenance 1;
    }
    
    # Health check - always allow
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Backend API - proxy to backend container (bypass maintenance for API)
    location /api {
        proxy_pass http://workalong-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Maintenance page
    location = /maintenance.html {
        root /var/www/maintenance;
        access_log off;
    }

    # Serve static files or maintenance page
    # HTML files should not be cached - they reference versioned JS/CSS files
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    location / {
        if ($maintenance) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Custom error page for maintenance (503)
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/maintenance;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

}

# API Subdomain - HTTPS Server
# This block only works if certificates exist in /etc/nginx/ssl/
# If certs don't exist, nginx will fail to start this server block (which is fine)
server {
    listen 443 ssl http2;
    server_name api.workalong.co.uk;
    
    # Production certificates (automatically detected if present)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Proxy all requests to backend
    # Frontend will add /api to URLs, so we preserve the full path
    location / {
        proxy_pass http://workalong-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

