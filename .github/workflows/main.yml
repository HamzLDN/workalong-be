name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.json'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup SSH tunnel to server
        run: |
          echo "Setting up SSH tunnel to forward localhost:8081 from server..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key - handle both single-line and multi-line formats
          SSH_KEY="${{ secrets.SSH_KEY }}"
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Verify key file was created correctly
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "❌ ERROR: SSH key file is empty or not created"
            exit 1
          fi
          
          # Add server to known_hosts
          SSH_PORT="${{ secrets.SSH_PORT || 22 }}"
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_USER="${{ secrets.SSH_USER }}"
          
          # Validate required variables
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "❌ ERROR: SSH_HOST or SSH_USER is not set"
            exit 1
          fi
          
          echo "SSH configuration:"
          echo "  Host: $SSH_HOST"
          echo "  Port: $SSH_PORT"
          echo "  User: $SSH_USER"
          echo "  Key file size: $(wc -c < ~/.ssh/deploy_key) bytes"
          echo "  Key starts with: $(head -c 20 ~/.ssh/deploy_key)"
          
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          
          # Test SSH connection first - use single line to avoid parsing issues
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10 -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "echo 'SSH connection successful'" || {
            echo "❌ SSH connection test failed"
            echo "Verifying SSH is available..."
            which ssh || echo "SSH not found in PATH"
            ssh -V || echo "SSH version check failed"
            exit 1
          }
          
          # Start SSH tunnel in background (forward remote localhost:8081 to local localhost:8081)
          # -L [bind_address:]port:host:hostport
          echo "Establishing SSH tunnel..."
          ssh -N -L 8081:localhost:8081 -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o LogLevel=ERROR -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" > /tmp/ssh_tunnel.log 2>&1 &
          
          TUNNEL_PID=$!
          echo "SSH tunnel PID: $TUNNEL_PID"
          echo $TUNNEL_PID > /tmp/ssh_tunnel.pid
          
          # Wait a moment for tunnel to establish
          echo "Waiting for tunnel to establish..."
          sleep 5
          
          # Check if tunnel process is still running
          if ! kill -0 $TUNNEL_PID 2>/dev/null; then
            echo "❌ SSH tunnel process died immediately"
            echo "SSH tunnel log:"
            cat /tmp/ssh_tunnel.log || true
            exit 1
          fi
          echo "SSH tunnel is running (PID: $TUNNEL_PID)"
          
          # Verify tunnel is working
          echo "Verifying SSH tunnel..."
          if ! curl -f http://localhost:8081/api/health > /dev/null 2>&1; then
            echo "❌ ERROR: SSH tunnel failed - cannot reach server's localhost:8081"
            echo "Checking SSH process..."
            ps aux | grep "[s]sh.*8081" || true
            echo "Checking if port 8081 is listening..."
            netstat -tlnp | grep 8081 || lsof -i :8081 || true
            echo "Make sure your server is running on localhost:8081"
            exit 1
          fi
          echo "✅ SSH tunnel established successfully"

      - name: Run API endpoint tests
        run: |
          echo "Running API endpoint tests against http://localhost:8081/api (via SSH tunnel)"
          echo "All tests must pass before deployment..."
          node scripts/test-api-endpoints.js
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          API_BASE_URL: http://localhost:8081/api
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'test-secret-for-ci' }}
        
      - name: Cleanup SSH tunnel
        if: always()
        run: |
          echo "Cleaning up SSH tunnel..."
          if [ -f /tmp/ssh_tunnel.pid ]; then
            TUNNEL_PID=$(cat /tmp/ssh_tunnel.pid)
            echo "Killing SSH tunnel (PID: $TUNNEL_PID)"
            kill $TUNNEL_PID 2>/dev/null || true
            rm -f /tmp/ssh_tunnel.pid
          fi
          pkill -f "ssh.*-L 8081:localhost:8081" || true
          rm -f ~/.ssh/deploy_key
          rm -f /tmp/ssh_tunnel.log

  deploy:
    name: Deploy Backend to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: invi5H/ssh-action@v1.0.0
        with:
          NAME: backend-server
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          script: |
            echo "Starting backend deployment..."
            cd /root/workalong-backend
            
            # Pull latest code
            git pull origin main
            
            # Stop existing container
            docker stop workalong-backend || echo "Container not running"
            docker rm workalong-backend || echo "Container does not exist"
            
            # Build new Docker image
            echo "Building Docker image..."
            docker build -f Dockerfile.backend.ubuntu -t workalong-backend:latest .
            
            # Start container with updated configuration
            echo "Starting backend container..."
            docker run -d \
              --name workalong-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -p 8443:443 \
              --env-file .env \
              -e NODE_ENV=production \
              -e DOCKER=true \
              -v /root/workalong-frontend/certs:/app/certs:ro \
              -v /root/workalong-frontend/docker/ssl:/etc/nginx/ssl:ro \
              --network workalong-backend_workalong-network \
              workalong-backend:latest
            
            # Wait for container to be healthy
            echo "Waiting for container to be healthy..."
            sleep 10
            
            # Check container status
            docker ps --filter "name=workalong-backend" --format "table {{.Names}}\t{{.Status}}"
            
            # Health check
            echo "Performing health check..."
            for i in {1..5}; do
              if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                exit 0
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 5
            done
            
            echo "Health check failed after 5 attempts"
            docker logs workalong-backend --tail 50
            exit 1

