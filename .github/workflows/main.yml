name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.json'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  unit-test:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npm test

  integration-test:
    name: Integration Tests (API + Security)
    runs-on: self-hosted  # Needs DB and server access
    needs: [unit-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment file for server
        run: |
          echo "Setting up .env file for backend server..."
          # Copy .env from the actual backend directory to the workspace
          if [ -f "/root/workalong-backend/.env" ]; then
            echo "Copying .env from /root/workalong-backend/ to workspace"
            cp /root/workalong-backend/.env .env
            echo "✅ .env file copied"
            echo "Verifying .env contains required database variables:"
            grep -E "^DB_(HOST|PORT|USER|PASSWORD|NAME)=" .env | sed 's/\(PASSWORD\)=.*/\1=***/' || echo "No DB_ variables found"
          else
            echo "⚠ WARNING: .env file not found at /root/workalong-backend/.env"
            echo "Server may not be able to connect to database"
          fi
          
      - name: Verify database connectivity
        run: |
          echo "Verifying database connectivity..."
          if [ -f ".env" ]; then
            # Source .env to get DB variables (safely)
            set -a
            source .env 2>/dev/null || true
            set +a
            
            # Check if PostgreSQL is accessible (in dev mode, port is 5433)
            DB_PORT=${DB_PORT:-5433}
            DB_HOST=${DB_HOST:-localhost}
            echo "Attempting to connect to database at $DB_HOST:$DB_PORT..."
            
            # Try to connect using psql if available, or just check if port is open
            if command -v psql >/dev/null 2>&1; then
              PGPASSWORD="${DB_PASSWORD}" psql -h "$DB_HOST" -p "$DB_PORT" -U "${DB_USER:-workalong}" -d "${DB_NAME:-users}" -c "SELECT 1;" >/dev/null 2>&1 && echo "✅ Database connection successful" || echo "⚠ Database connection test failed (may still work if using different auth)"
            else
              # Just check if port is open
              timeout 2 bash -c "echo > /dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null && echo "✅ Database port $DB_PORT is open" || echo "⚠ Cannot reach database port $DB_PORT"
            fi
          else
            echo "⚠ Skipping database check - no .env file"
          fi

      - name: Launch backend server for testing
        run: |
          echo "Starting backend server in dev mode..."
          echo "Current directory: $(pwd)"
          echo "Working directory: ${{ github.workspace }}"
          echo "Checking for .env file:"
          ls -la .env || echo ".env file not found in current directory"
          # Set a dummy Stripe test key for dev mode to prevent initialization errors
          # Payment endpoints will fail gracefully with API errors
          export STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY:-sk_test_00000000000000000000000000000000000000000000000000}"
          # Start server and capture both stdout and stderr
          NODE_ENV=dev npm run dev > /tmp/backend.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > /tmp/backend.pid
          echo "Backend server started with PID: $SERVER_PID"
          echo "Waiting a moment for server to initialize..."
          sleep 5
          echo "Checking if process is still running..."
          if ps -p $SERVER_PID > /dev/null 2>&1; then
            echo "✅ Server process is running"
            echo "Recent server logs:"
            tail -30 /tmp/backend.log || echo "No logs available yet"
          else
            echo "❌ Server process died immediately. Logs:"
            cat /tmp/backend.log
            exit 1
          fi
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_00000000000000000000000000000000000000000000000000' }}

      - name: Wait for backend server to be ready
        run: |
          echo "Waiting for backend server to be accessible on localhost:8081..."
          echo "Checking server process status..."
          if [ -f /tmp/backend.pid ]; then
            PID=$(cat /tmp/backend.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "✅ Server process is running (PID: $PID)"
            else
              echo "❌ Server process is not running (PID: $PID)"
              echo "Backend logs:"
              cat /tmp/backend.log || echo "No logs available"
              exit 1
            fi
          fi
          
          for i in {1..30}; do
            if curl -f http://localhost:8081/api/health > /dev/null 2>&1; then
              echo "✅ Backend server is accessible"
              exit 0
            fi
            echo "Waiting for server... (attempt $i/30)"
            if [ $((i % 5)) -eq 0 ]; then
              echo "Recent server logs:"
              tail -20 /tmp/backend.log || echo "No logs available"
            fi
            sleep 2
          done
          echo "❌ ERROR: Backend server did not become accessible within 60 seconds"
          echo "Full backend logs:"
          cat /tmp/backend.log || echo "No logs available"
          echo "Checking if process is still running:"
          if [ -f /tmp/backend.pid ]; then
            PID=$(cat /tmp/backend.pid)
            ps -p $PID || echo "Process not found"
          fi
          exit 1

      - name: Load environment variables from .env
        run: |
          echo "Loading SESSION_SECRET from .env file..."
          # Check if .env exists in the checked-out repo or in the server's workalong-backend directory
          ENV_FILE=".env"
          if [ ! -f "$ENV_FILE" ]; then
            # Try the server's actual backend directory
            if [ -f "/root/workalong-backend/.env" ]; then
              ENV_FILE="/root/workalong-backend/.env"
              echo "Using .env from /root/workalong-backend/.env"
            else
              echo "⚠ WARNING: .env file not found in current directory or /root/workalong-backend/"
              echo "⚠ This may cause CSRF token mismatches if SESSION_SECRET differs"
            fi
          fi
          
          if [ -f "$ENV_FILE" ]; then
            # Extract SESSION_SECRET, handling quoted and unquoted values
            SESSION_SECRET=$(grep "^SESSION_SECRET=" "$ENV_FILE" | cut -d '=' -f2- | sed 's/^["'\'']//; s/["'\'']$//' | tr -d ' ' || echo "")
            if [ -z "$SESSION_SECRET" ]; then
              echo "⚠ WARNING: SESSION_SECRET not found or empty in .env, using fallback"
              SESSION_SECRET="change-this-secret-key-in-production"
            else
              echo "✓ SESSION_SECRET loaded from $ENV_FILE (length: ${#SESSION_SECRET})"
            fi
          else
            echo "⚠ WARNING: .env file not found, using fallback SESSION_SECRET"
            SESSION_SECRET="change-this-secret-key-in-production"
          fi
          echo "SESSION_SECRET=$SESSION_SECRET" >> $GITHUB_ENV
          echo "SESSION_SECRET_FILE=$ENV_FILE" >> $GITHUB_ENV

      - name: Run API endpoint tests
        run: |
          echo "=========================================="
          echo "Running API endpoint tests"
          echo "=========================================="
          echo "Testing against http://localhost:8081/api"
          echo "Using SESSION_SECRET from ${{ env.SESSION_SECRET_FILE || '.env' }} (same as backend server)"
          echo "SESSION_SECRET length: ${#SESSION_SECRET}"
          
          # Ensure the test script can find the .env file
          if [ -f "/root/workalong-backend/.env" ] && [ ! -f ".env" ]; then
            echo "Copying .env from /root/workalong-backend/ to current directory for test script"
            cp /root/workalong-backend/.env .env || echo "Failed to copy .env"
          fi
          
          # Check server status before running tests
          echo "Checking server status before tests..."
          if [ -f /tmp/backend.pid ]; then
            PID=$(cat /tmp/backend.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "✅ Server is running (PID: $PID)"
            else
              echo "❌ Server is not running!"
              echo "Server logs:"
              cat /tmp/backend.log || echo "No logs available"
              exit 1
            fi
          fi
          
          # Run API endpoint tests
          if node scripts/test-api-endpoints.js; then
            echo "✅ API endpoint tests PASSED"
          else
            TEST_EXIT_CODE=$?
            echo "=========================================="
            echo "❌ API endpoint tests FAILED (exit code: ${TEST_EXIT_CODE})"
            echo "Showing server logs:"
            echo "=========================================="
            cat /tmp/backend.log || echo "No logs available"
            echo "=========================================="
            exit $TEST_EXIT_CODE
          fi

      - name: Run security tests
        run: |
          echo "=========================================="
          echo "Running security tests"
          echo "=========================================="
          echo "Testing against http://localhost:8081/api"
          echo "Using SESSION_SECRET from ${{ env.SESSION_SECRET_FILE || '.env' }} (same as backend server)"
          echo "SESSION_SECRET length: ${#SESSION_SECRET}"
          
          # Ensure the test script can find the .env file
          if [ -f "/root/workalong-backend/.env" ] && [ ! -f ".env" ]; then
            echo "Copying .env from /root/workalong-backend/ to current directory for test script"
            cp /root/workalong-backend/.env .env || echo "Failed to copy .env"
          fi
          
          # Check server status before running tests
          echo "Checking server status before tests..."
          if [ -f /tmp/backend.pid ]; then
            PID=$(cat /tmp/backend.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "✅ Server is running (PID: $PID)"
            else
              echo "❌ Server is not running!"
              echo "Server logs:"
              cat /tmp/backend.log || echo "No logs available"
              exit 1
            fi
          fi
          
          # Run security tests
          if node scripts/test-security.js; then
            echo "✅ Security tests PASSED"
          else
            SECURITY_TEST_EXIT_CODE=$?
            echo "=========================================="
            echo "❌ Security tests FAILED (exit code: ${SECURITY_TEST_EXIT_CODE})"
            echo "Showing server logs:"
            echo "=========================================="
            cat /tmp/backend.log || echo "No logs available"
            echo "=========================================="
            exit $SECURITY_TEST_EXIT_CODE
          fi
          
          echo "✅ All tests passed. Proceeding with deployment."
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          API_BASE_URL: http://localhost:8081/api
          SESSION_SECRET: ${{ env.SESSION_SECRET }}

      - name: Cleaning up the backend testing server
        if: always()
        run: |
          echo "Stopping backend server..."
          if [ -f /tmp/backend.pid ]; then
            PID=$(cat /tmp/backend.pid)
            if ps -p $PID > /dev/null 2>&1; then
              kill $PID || true
              echo "Backend server stopped (PID: $PID)"
            else
              echo "Backend server process not found"
            fi
            rm -f /tmp/backend.pid
          else
            echo "No PID file found, server may have already stopped"
          fi

  deploy:
    name: Deploy Backend to Server
    needs: [integration-test, lint, format]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.integration-test.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest code
        run: |
          cd /root/workalong-backend
          git pull origin main

      - name: Stop existing container
        run: |
          docker stop workalong-backend || echo "Container not running"
          docker rm workalong-backend || echo "Container does not exist"

      - name: Build Docker image
        run: |
          cd /root/workalong-backend
          echo "Building Docker image..."
          docker build -f Dockerfile.backend.ubuntu -t workalong-backend:latest .

      - name: Start container
        run: |
          cd /root/workalong-backend
          echo "Starting backend container..."
          # PostgreSQL is on 'workalong_workalong-network', connect backend to that network
          # Use container name 'workalong-postgres' as DB_HOST when on same network
          docker run -d \
            --name workalong-backend \
            --restart unless-stopped \
            -p 8080:8080 \
            -p 8443:443 \
            --env-file .env \
            -e NODE_ENV=production \
            -e DOCKER=true \
            -e DB_HOST=workalong-postgres \
            -v /root/workalong-frontend/certs:/app/certs:ro \
            -v /root/workalong-frontend/docker/ssl:/etc/nginx/ssl:ro \
            --network workalong_workalong-network \
            workalong-backend:latest

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container to be healthy..."
          sleep 10
          
          # Check container status
          docker ps --filter "name=workalong-backend" --format "table {{.Names}}\t{{.Status}}"
          
          # Health check
          echo "Performing health check..."
          for i in {1..5}; do
            if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 5
          done
          
          echo "Health check failed after 5 attempts"
          docker logs workalong-backend --tail 50
          exit 1

