name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.json'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Backend API
    runs-on: self-hosted  # Runs on your server, can access localhost:8081 directly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify server is running
        run: |
          echo "Verifying backend server is accessible on localhost:8081..."
          if ! curl -f http://localhost:8081/api/health > /dev/null 2>&1; then
            echo "❌ ERROR: Backend server is not running on localhost:8081"
            echo "Please ensure your backend is running before running tests"
            exit 1
          fi
          echo "✅ Backend server is accessible"

      - name: Run API endpoint tests
        run: |
          echo "Running API endpoint tests against http://localhost:8081/api"
          echo "All tests must pass before deployment..."
          node scripts/test-api-endpoints.js
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          API_BASE_URL: http://localhost:8081/api
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'test-secret-for-ci' }}

  deploy:
    name: Deploy Backend to Server
    needs: test
    runs-on: self-hosted  # Also runs on your server for deployment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest code
        run: |
          cd /root/workalong-backend
          git pull origin main

      - name: Stop existing container
        run: |
          docker stop workalong-backend || echo "Container not running"
          docker rm workalong-backend || echo "Container does not exist"

      - name: Build Docker image
        run: |
          cd /root/workalong-backend
          echo "Building Docker image..."
          docker build -f Dockerfile.backend.ubuntu -t workalong-backend:latest .

      - name: Start container
        run: |
          cd /root/workalong-backend
          echo "Starting backend container..."
          # PostgreSQL is on 'workalong_workalong-network', connect backend to that network
          # Use container name 'workalong-postgres' as DB_HOST when on same network
          docker run -d \
            --name workalong-backend \
            --restart unless-stopped \
            -p 8080:8080 \
            -p 8443:443 \
            --env-file .env \
            -e NODE_ENV=production \
            -e DOCKER=true \
            -e DB_HOST=workalong-postgres \
            -v /root/workalong-frontend/certs:/app/certs:ro \
            -v /root/workalong-frontend/docker/ssl:/etc/nginx/ssl:ro \
            --network workalong_workalong-network \
            workalong-backend:latest

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container to be healthy..."
          sleep 10
          
          # Check container status
          docker ps --filter "name=workalong-backend" --format "table {{.Names}}\t{{.Status}}"
          
          # Health check
          echo "Performing health check..."
          for i in {1..5}; do
            if curl -f http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 5
          done
          
          echo "Health check failed after 5 attempts"
          docker logs workalong-backend --tail 50
          exit 1

